<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ROOKHIDE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="nav-container">
        <div class="nav-content">
            <a href="{{ url_for('index') }}" class="logo">
                <img class="logo-img" src="{{ url_for('static', filename='images/rook_transparent-removebg-preview.png') }}" alt="ROOKHIDE logo" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex';">
                <span class="logo-text logo-fallback">ROOKHIDE</span>
            </a>
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
            <div class="nav-links" id="siteNavLinks">
                <a href="{{ url_for('home') }}">Home</a>
                <a href="{{ url_for('file_upload') }}">Encrypt/Decrypt</a>
                <a href="{{ url_for('preview') }}">Live Preview</a>
                <a href="{{ url_for('visualizer') }}">Visualizer</a>
                <a href="{{ url_for('about') }}">About Team</a>
                <a href="{{ url_for('get_in_touch') }}" class="active">Contact</a>

            </div>
        </div>
    </nav>

    <section class="contact-section reveal">
        <div class="section-header reveal">
            <h1>Get in Touch</h1>
            <p>Have questions? We'd love to hear from you.</p>
        </div>

        <div class="contact-container">
            <div class="contact-form card reveal">
                <form id="contactForm" action="{{ url_for('submit_contact') }}" method="POST">
                    
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" class="form-control" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary" id="contactSubmitBtn">
                        <i class="fas fa-paper-plane"></i>
                        Send Message
                    </button>
                </form>
                <p id="contactStatus" class="contact-status" aria-live="polite"></p>
            </div>

            <div class="contact-info card reveal">
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <h3>Email Us</h3>
                    <p>chesscrytcse@gmail.com</p>
                </div>
                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <h3>Response Time</h3>
                    <p>Within 24 hours</p>
                </div>
                <div class="info-item">
                    <i class="fas fa-shield-alt"></i>
                    <h3>Security First</h3>
                    <p>Your data is always protected</p>
                </div>
            </div>
        </div>
    </section>

    <script src="{{ url_for('static', filename='js/site.js') }}" defer></script>
    <script>
        const contactForm = document.getElementById('contactForm');
        const contactSubmitBtn = document.getElementById('contactSubmitBtn');
        const contactStatus = document.getElementById('contactStatus');

        function setContactStatus(message, isError) {
            contactStatus.textContent = message;
            contactStatus.style.color = isError ? '#ff6b6b' : '#7CFC98';
        }

        contactForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const originalButtonHtml = contactSubmitBtn.innerHTML;
            contactSubmitBtn.disabled = true;
            contactSubmitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            setContactStatus('', false);

            try {
                const formData = new FormData(contactForm);
                const response = await fetch(contactForm.action, {
                    method: 'POST',
                    body: formData,
                });

                const payload = await response.json();
                if (!response.ok) {
                    setContactStatus(payload.error || 'Unable to send message right now', true);
                    return;
                }

                setContactStatus(payload.message || 'Message sent successfully', false);
                contactForm.reset();
            } catch (error) {
                setContactStatus('Network error. Please try again.', true);
            } finally {
                contactSubmitBtn.disabled = false;
                contactSubmitBtn.innerHTML = originalButtonHtml;
            }
        });
    </script>
</body>
</html>
